# ============================================================
# PAUL'S KNOWN GAPS — be honest, do not paper over these
# ============================================================
known_gaps:
  - SQL skills (material gap for analytics-heavy or data PM roles)
  - Formal product management experience (cannot claim PM practitioner)
  - IT infrastructure / cloud / MSP delivery experience
  - Financial services domain knowledge (KYB, KYC, payments, banking)
  - Direct people management (line managing 4+ direct reports)
  - Agile certification (PSM, CSM, SAFe)
  - SaaS implementation PM experience specifically
  - Experience inside a product-led tech company (Ipsos is a research agency)
  - Private markets, legal, or professional services domain knowledge

# ============================================================
# TRAJECTORY CHECK
# ============================================================
trajectory:
  target: >
    Roles that put Paul inside a product-led tech company are prioritised.
    The longer-term goal is to move toward product design.
    Roles that lead toward IT services delivery, charity ops, or corporate
    programme management tracks should be flagged as trajectory risks,
    even if the fit score is technically above threshold.
  positive_signals:
    - Working inside an AI product company
    - Building product ops credentials
    - Close proximity to product and engineering teams
    - Roles at companies like Metaview, Wise, Kraken (even if not ready yet)
  negative_signals:
    - IT outsourcing delivery track
    - Charity operations (exit paths toward third sector)
    - Large corporate programme management (exit paths toward more of the same)
    - Domain-specific delivery (food logistics, energy, legal) with no AI angle

# ============================================================
# OUTPUT FORMAT — return assessments in this structure
# ============================================================
output_format: |
  **Role:** [Job title] at [Company]
  **Fit score:** [X/10]
  **Threshold:** [Apply / Borderline / Skip]

  **Why it works:**
  - [3–5 bullet points on genuine strengths]

  **Hard gaps:**
  - [2–4 bullet points on structural gaps or blockers]

  **Trajectory check:** [One sentence — does this move Paul toward or away from product ops/AI delivery at a tech company, and eventually product design?]

  **Recommendation:** [One clear sentence — apply, borderline (Paul's call), or skip — with the single most important reason]
